<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Intro</title>
</head>

<body>
    <h1 id="p_title">Lorem ipsum dolor sit amet.</h1>

    <div>
        <button onclick="p_title.style.color=`red`;">Red</button>
        <button>Green</button>
        <button>Blue</button>
        <button>Pink</button>
    </div>

    <div>
        <button onclick="p_title.style.fontSize=`5px`;">5px</button>
        <button>10px</button>
        <button>20px</button>
        <button>30px</button>
        <button>35px</button>
    </div>

    <div>
        <button>lightcoral BG</button>
        <button>lightseagreen BG</button>
        <button>skyblue BG</button>
        <button>darkcyan BG</button>
        <button>pink BG</button>
    </div>
</body>

</html>
