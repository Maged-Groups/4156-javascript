<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 1s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: black;
            height: 100vh;
            background-size: cover;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .light {
            background-image: url(assets/imgs/lights.jpg);
        }

        button {
            border: none;
            background-color: transparent;
            color: wheat;
            cursor: pointer;
        }

        button:hover {
            color: #f3ff17;
        }
    </style>
</head>

<body>
    <button onclick="document.body.classList.toggle(`light`)">Light</button>
</body>

</html>
