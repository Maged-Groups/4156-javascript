<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 1s;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: black;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 50px;
            padding: 45px;
            overflow: hidden;
        }

        div {
            width: 250px;
            aspect-ratio: 1;
            border-radius: 50%;
            border-style: solid;
            background-color: #212221;
        }

        .green {
            background-color: #053b05;
            box-shadow: 0 0 25px green, 0 0 5px 10px green, 0 0 130px 60px #17f360;
            border-color: #073b07;
        }

        button {
            border: none;
            background-color: transparent;
            color: #75d30b;
            cursor: pointer;
        }

        button:hover {
            color: #cdebd3;
        }
    </style>
</head>

<body>

    <div id="container"></div>

    <section>
        <button onclick="container.classList.add(`green`);">ON</button>
        <button>OFF</button>
    </section>
</body>

</html>
